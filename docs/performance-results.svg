<svg xmlns="http://www.w3.org/2000/svg" width="960" height="2220" viewBox="0 0 960 2220" role="img" aria-labelledby="title desc">
  <title id="title">BulkSaveChanges performance results</title>
  <desc id="desc">Horizontal bar chart showing speedup versus SaveChanges for save and synchronize scenarios.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    text { font-family: Segoe UI, Arial, sans-serif; fill: #172033; }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #566174; }
    .scenario { font-size: 15px; font-weight: 700; }
    .row-count { font-size: 13px; font-weight: 700; fill: #394255; }
    .method { font-size: 12px; fill: #566174; }
    .subsection-rule { stroke: #e2e8f0; stroke-width: 1; }
    .axis { stroke: #c9d1dd; stroke-width: 1; }
    .grid { stroke: #edf1f6; stroke-width: 1; }
    .tick { font-size: 11px; fill: #697386; }
    .value { font-size: 12px; font-weight: 600; }
  </style>
  <text x="24" y="32" class="title">BulkSaveChanges Performance</text>
  <text x="24" y="52" class="subtitle">Speedup is calculated against SaveChanges for the same scenario and row count. Values below 1x are slower.</text>
