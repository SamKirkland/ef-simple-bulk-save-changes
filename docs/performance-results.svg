  <text x="351.25" y="1068" class="tick" text-anchor="middle">1x</text>
  <line x1="432.5" y1="74" x2="432.5" y2="1044" class="grid"/>
  <text x="432.5" y="1068" class="tick" text-anchor="middle">2x</text>
  <line x1="513.75" y1="74" x2="513.75" y2="1044" class="grid"/>
  <text x="513.75" y="1068" class="tick" text-anchor="middle">3x</text>
